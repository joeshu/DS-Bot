name: iOS unsigned IPA

# Builds the phone app without any signing and keeps the .ipa as an artifact
# for sideloading (AltStore, Sideloadly, TrollStore sign it on install). No
# Apple account, certificate or profile is involved. Trigger it by hand:
#   gh workflow run ios-unsigned.yml --ref main
# The artifact keeps for 7 days, like the release dry run.
#
# The signed App Store path stays in mobile/scripts/ios-archive.sh; this file
# does not touch it.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-unsigned:
    name: Phone app (iOS, unsigned)
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-fund --no-audit --prefix ../link
      - run: npm ci --no-fund --no-audit
      - run: npm run typecheck
      - run: npm test
      - run: npx expo prebuild --platform ios --no-install
      - run: pod install
        working-directory: mobile/ios
      - name: Check Expo pod versions match npm
        run: |
          # pod install must resolve the Expo pods from node_modules, not
          # from the CocoaPods specs repo: a mismatch here is how the 0.3.8
          # IPA shipped ExpoFileSystem against an older ExpoModulesCore and
          # died at launch with dyld "Symbol not found".
          pod_version() { sed -n "s/^  - $1 (\([0-9.]*\)).*$/\1/p" ios/Podfile.lock | head -1; }
          for pair in "ExpoModulesCore:expo-modules-core" "ExpoFileSystem:expo-file-system"; do
            pod="${pair%%:*}"; pkg="${pair##*:}"
            pv="$(pod_version "$pod")"
            nv="$(node -p "require('./node_modules/$pkg/package.json').version")"
            echo "$pod: pod=$pv npm=$nv"
            if [ "$pv" != "$nv" ]; then echo "::error::$pod pod version ($pv) != npm version ($nv)"; exit 1; fi
          done
      - name: Archive without signing
        run: |
          xcodebuild -workspace ios/DSBot.xcworkspace -scheme DSBot -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ios/build/DSBot.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive
      - name: Pack the unsigned IPA
        run: |
          app="$(ls -d ios/build/DSBot.xcarchive/Products/Applications/*.app | head -1)"
          if [ -z "$app" ]; then echo "::error::No .app in the archive"; exit 1; fi
          rm -rf Payload
          mkdir -p Payload
          cp -R "$app" Payload/
          version="$(node -p "require('../ds-bot/package.json').version")"
          zip -r -q "DS-Bot-$version-ios-unsigned.ipa" Payload
          rm -rf Payload
          ls -l DS-Bot-*-ios-unsigned.ipa
      - name: Check the IPA
        run: |
          ipa="$(ls DS-Bot-*-ios-unsigned.ipa)"
          if ! unzip -l "$ipa" | grep -q 'Payload/.*\.app/Info\.plist'; then
            echo "::error::$ipa has no Payload/*.app/Info.plist"
            exit 1
          fi
          if unzip -l "$ipa" | grep -Eq 'Payload/.*\.app/.*CodeSignature'; then
            echo "::error::$ipa is signed; expected an unsigned build"
            exit 1
          fi
          echo "Unsigned IPA OK: $ipa ($(stat -f %z "$ipa" 2>/dev/null || stat -c %s "$ipa") bytes)"
      - name: Check Expo framework symbols agree
        run: |
          # The 0.3.8 IPA died at launch twice: first ExpoFileSystem referenced
          # an ExpoModulesCore Swift symbol the bundled core did not define,
          # then ExpoModulesCore referenced RCTStatusBarAppearance, a class
          # the bundled React framework did not define (dyld "Symbol not
          # found" both times). Fail the build instead of shipping another
          # IPA that crashes before any app code runs.
          ipa="$(ls DS-Bot-*-ios-unsigned.ipa)"
          rm -rf /tmp/ipa-symbols && mkdir -p /tmp/ipa-symbols
          unzip -q "$ipa" -d /tmp/ipa-symbols
          app="$(ls -d /tmp/ipa-symbols/Payload/*.app | head -1)"
          # Every symbol defined anywhere in the bundle.
          : > /tmp/ipa-symbols/defined.txt
          for f in "$app/DSBot" "$app"/Frameworks/*.framework/*; do
            [ -f "$f" ] || continue
            nm -gU -arch arm64 "$f" 2>/dev/null | awk 'NF>=3 {print $NF}' >> /tmp/ipa-symbols/defined.txt || true
          done
          sort -u /tmp/ipa-symbols/defined.txt -o /tmp/ipa-symbols/defined.txt
          # Undefined symbols that belong to a bundled framework (React
          # Native, Expo, ...) must be defined in the bundle. Symbols from
          # the OS (UIKit, Foundation, ...) resolve at runtime and are not
          # checked.
          missing=""
          for f in "$app"/Frameworks/*.framework/*; do
            [ -f "$f" ] || continue
            nm -u -arch arm64 "$f" 2>/dev/null | awk 'NF>=2 {print $NF}' \
              | grep -E '^_OBJC_(CLASS|METACLASS)_\$_(RCT|Expo)|^_\$s[0-9]+(Expo|React)|^_(RCT|Expo)[A-Z]' \
              | sort -u > /tmp/ipa-symbols/undef.txt || true
            m="$(comm -23 /tmp/ipa-symbols/undef.txt /tmp/ipa-symbols/defined.txt || true)"
            if [ -n "$m" ]; then
              missing="$missing
$(basename "$f"):
$m"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Bundled frameworks reference symbols no bundled framework defines (dyld would abort at launch):$missing"
            exit 1
          fi
          echo "Expo framework symbols agree"
      - uses: actions/upload-artifact@v4
        with:
          name: DS-Bot-ios-unsigned
          path: mobile/DS-Bot-*-ios-unsigned.ipa
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
